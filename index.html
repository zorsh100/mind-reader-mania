<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Reader Mania</title>
<style>
  :root {
    --bg: #fff4d6;
    --ink: #2b2340;
    --card: #ffffff;
    --pink: #ff5c8a;
    --pink-dark: #c43a64;
    --blue: #3cb4ff;
    --blue-dark: #1f7fbf;
    --yellow: #ffd23f;
    --green: #2ecc71;
    --muted: #7a6f8e;
    --night: #2b2340;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(#ffe39a 2px, transparent 2px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif;
  }
  #app { max-width: 880px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.6rem); color: var(--pink); text-shadow: 2px 2px 0 var(--night); }
  h2 { margin: 0 0 8px; }
  h3 { margin: 16px 0 10px; }
  p { line-height: 1.45; }
  button { font: inherit; cursor: pointer; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .link { background: none; border: 2px solid var(--night); border-radius: 999px; padding: 4px 12px; color: var(--ink); }
  .btn {
    border: none; border-radius: 14px; padding: 12px 22px; font-size: 1.1rem;
    background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-dark);
  }
  .btn.blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-dark); }
  .center { text-align: center; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .info { background: var(--card); border: 2px solid #e8d9a8; border-radius: 12px; padding: 10px 14px; }
  .small { font-size: .85rem; color: var(--muted); }
  .face { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 16px 0; }
  .mode { background: var(--card); border: 4px solid var(--night); border-radius: 20px; padding: 18px; text-align: left; color: var(--ink); }
  .mode:hover { transform: rotate(-1deg) scale(1.02); }
  .mode .big { font-size: 2.4rem; }
  .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .char {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--card); border: 4px solid var(--night); border-radius: 18px; padding: 14px;
    text-align: left; color: var(--ink); font-size: .95rem; line-height: 1.4;
  }
  button.char:hover { transform: translateY(-4px); box-shadow: 0 6px 0 var(--night); }
  .char .pic { width: 104px; height: 104px; margin: 0 auto 4px; }
  .char .art { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; border: 3px solid var(--night); }
  .char .cname { text-align: center; font-size: 1.25rem; font-weight: bold; }
  .char .tagline { text-align: center; font-style: italic; color: var(--muted); margin-top: -4px; }
  .char .quote { background: #f3eefc; border-radius: 10px; padding: 6px 10px; font-style: italic; }
  .char .fact { margin: 0; }
  .char .power { margin-top: auto; border-top: 2px dashed #ddd; padding-top: 8px; font-weight: bold; }
  .char .pick { text-align: center; margin-top: 4px; background: var(--pink); color: #fff; border-radius: 10px; padding: 6px; font-weight: bold; }
  .char .powertext { margin-top: 4px; font-weight: normal; font-size: .9rem; background: #e9f7ff; border-radius: 10px; padding: 6px 8px; }
  .char.taken { opacity: .35; cursor: not-allowed; }
  .rules { margin-top: 18px; background: var(--yellow); border: 4px solid var(--night); border-radius: 18px; padding: 14px 18px; }
  .rules h3 { margin: 4px 0 8px; }
  .rules ul { margin: 0 0 8px; padding-left: 22px; line-height: 1.5; }
  .bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .chip { display: flex; gap: 10px; align-items: center; background: var(--card); border: 3px solid var(--night); border-radius: 14px; padding: 8px 10px; }
  .chip .pic { width: 54px; height: 54px; flex: none; }
  .chip .score { font-size: 1.4rem; font-weight: bold; margin-left: auto; }
  .role { display: inline-block; font-size: .75rem; background: var(--yellow); border-radius: 999px; padding: 1px 8px; margin-left: 4px; }
  .round { text-align: center; font-weight: bold; margin: 4px 0 10px; }
  .wyr { text-align: center; font-size: clamp(1.3rem, 4vw, 1.8rem); margin: 10px 0; }
  .sides { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
  .side {
    position: relative; background: var(--card); color: var(--ink); border: 4px solid var(--night);
    border-radius: 18px; padding: 20px 14px 36px; font-size: clamp(1.1rem, 3.5vw, 1.35rem); line-height: 1.4; min-height: 150px;
  }
  button.side:hover { background: #fff1b8; transform: scale(1.02); }
  .side.picked { border-color: var(--green); background: #eafff1; }
  .side .tag { position: absolute; right: 12px; bottom: 8px; font-size: 1.2rem; }
  .side .marks { position: absolute; left: 10px; bottom: 6px; font-size: .9rem; }
  .or { align-self: center; font-weight: bold; font-size: 1.5rem; color: var(--pink); }
  .powerbtn {
    display: block; width: 100%; margin: 12px 0; background: #e9f7ff; border: 3px dashed var(--blue);
    border-radius: 14px; padding: 10px 12px; text-align: left; color: var(--ink);
  }
  .powerbtn:hover { background: #d3efff; }
  .armed { background: var(--blue); color: #fff; border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-weight: bold; }
  .cover { text-align: center; background: var(--night); color: #fff; border-radius: 22px; padding: 28px 18px; }
  .cover .pic { width: 130px; height: 130px; margin: 0 auto 12px; }
  .cover h2 { color: var(--yellow); }
  .thinking { font-size: 1.25rem; text-align: center; animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .result { background: var(--card); border: 4px solid var(--green); border-radius: 18px; padding: 16px; margin: 12px 0; text-align: center; }
  .result.miss { border-color: var(--pink); }
  .result p { margin: 6px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; font-size: .9rem; color: var(--muted); }
  @media (max-width: 560px) {
    .sides { grid-template-columns: 1fr; }
    .or { text-align: center; }
    .bar { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

/* =========================================================
   MIND READER MANIA - a Would You Rather game for 1 or 2 players
   One player picks a side in secret. The other player guesses.
   A right guess gets 1 point. Most points after 10 rounds wins.
   ========================================================= */

/* ---------- Settings ---------- */
const ROUNDS = 10;          // must be even so each player guesses the same number of times
const COMPUTER_DELAY = 1400; // milliseconds the computer "thinks"
const POWERS_ON = false;     // special powers are switched off for now; set to true to bring them back

/* ---------- Tastes (each side of a card has one) ---------- */
const TAGS = {
  m: { icon: "💰", name: "money" },
  g: { icon: "🤢", name: "gross stuff" },
  f: { icon: "🍕", name: "food" },
  a: { icon: "🐾", name: "animals" },
  s: { icon: "🎒", name: "school" },
  p: { icon: "⚡", name: "superpowers" },
  x: { icon: "🤪", name: "silly stuff" },
  v: { icon: "🗺️", name: "adventure" },
  c: { icon: "🌙", name: "space" },
  t: { icon: "⚽", name: "sports" },
  r: { icon: "🎨", name: "art" },
  k: { icon: "🤖", name: "gadgets" },
  h: { icon: "👻", name: "spooky stuff" },
  n: { icon: "🌻", name: "nature" }
};

/* ---------- Helpers ---------- */
const app = document.getElementById("app");
let S = null;
let timer = null;

function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function later(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms); }
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) { if (typeof v === "function") e.addEventListener(k.slice(2), v); }
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function render(...nodes) { app.replaceChildren(...nodes.flat().filter(Boolean)); window.scrollTo(0, 0); }

/* ---------- Faces ---------- */
function faceSVG(L) {
  const hc = L.hairColor;
  const cap = `<path d="M20 52 Q22 20 50 20 Q78 20 80 52 Q70 36 50 36 Q30 36 20 52Z" fill="${hc}"/>`;
  let back = "", front = "", extra = "";
  if (L.hair === "short") front = cap;
  if (L.hair === "long") {
    back = `<path d="M18 58 Q18 18 50 18 Q82 18 82 58 L82 86 L18 86 Z" fill="${hc}"/>`;
    front = `<path d="M22 50 Q26 22 50 22 Q74 22 78 50 Q62 34 50 37 Q38 34 22 50Z" fill="${hc}"/>`;
  }
  if (L.hair === "spiky") front = `<path d="M20 52 L24 30 L32 38 L38 18 L46 32 L52 12 L58 32 L66 18 L70 38 L78 30 L80 52 Q66 38 50 38 Q34 38 20 52Z" fill="${hc}"/>`;
  if (L.hair === "pigtails") {
    back = `<circle cx="18" cy="60" r="11" fill="${hc}"/><circle cx="82" cy="60" r="11" fill="${hc}"/>`;
    front = cap;
  }
  if (L.hair === "curly") {
    front = [24, 34, 44, 56, 66, 76].map(x => `<circle cx="${x}" cy="${x < 30 || x > 70 ? 42 : 30}" r="11" fill="${hc}"/>`).join("") +
            [30, 42, 58, 70].map(x => `<circle cx="${x}" cy="24" r="10" fill="${hc}"/>`).join("");
  }
  if (L.hair === "bun") {
    back = `<circle cx="50" cy="16" r="12" fill="${hc}"/>`;
    front = cap;
  }
  if (L.hair === "bald") {
    back = `<ellipse cx="22" cy="54" rx="7" ry="10" fill="${hc}"/><ellipse cx="78" cy="54" rx="7" ry="10" fill="${hc}"/>`;
  }
  if (L.hair === "cap") {
    front = `<path d="M21 46 Q22 20 50 20 Q78 20 79 46 Z" fill="${hc}"/><path d="M50 44 L88 44 Q90 50 80 50 L50 50 Z" fill="${hc}"/>`;
  }
  if (L.hair === "hood") {
    back = `<path d="M12 90 Q8 18 50 12 Q92 18 88 90 Z" fill="${hc}"/>`;
    front = `<path d="M24 50 Q28 30 50 30 Q72 30 76 50 Q64 40 50 40 Q36 40 24 50Z" fill="${hc}"/>`;
  }
  if (L.beard) extra += `<path d="M28 68 Q30 94 50 94 Q70 94 72 68 Q66 86 50 86 Q34 86 28 68Z" fill="${hc}"/>`;
  if (L.glasses) extra += `<g fill="none" stroke="#2b2340" stroke-width="2.5"><circle cx="40" cy="57" r="8"/><circle cx="60" cy="57" r="8"/><path d="M48 57 L52 57"/></g>`;
  if (L.hat) extra += `<path d="M30 34 Q26 12 40 14 Q50 2 60 14 Q74 12 70 34 Z" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/><rect x="30" y="30" width="40" height="8" rx="3" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>`;
  return `<svg class="face" viewBox="0 0 100 100" aria-hidden="true">

    <circle cx="33" cy="67" r="4" fill="#ff8fa3" opacity=".6"/><circle cx="67" cy="67" r="4" fill="#ff8fa3" opacity=".6"/>
    <path d="M41 70 Q50 78 59 70" stroke="#2b2340" stroke-width="3" fill="none" stroke-linecap="round"/>${extra}</svg>`;
}
function pic(c) {
  const a = ART[c.id];
  if (a && a.face) return el("div", { class: "pic" }, el("img", { class: "face", src: a.face, alt: c.name }));
  return el("div", { class: "pic", html: faceSVG(c.look) });
}
function cardPic(c) {
  const a = ART[c.id];
  if (a && a.art) return el("img", { class: "art", src: a.art, alt: c.name });
  return pic(c);
}

/* ---------- Game state helpers ---------- */
function P(i) { return S.players[i]; }
function other(i) { return 1 - i; }
function powerKey(i) {
  const k = P(i).char.power;
  return k === "copy" ? P(other(i)).char.power : k;
}
function canUse(i, phase) { return POWERS_ON && !P(i).used && S.frozen !== i && POWERS[powerKey(i)].when === phase; }
function usePower(i) {
  P(i).used = true;
  S.armed[i] = powerKey(i);
  if (S.armed[i] === "newcard") S.card = nextCard();
  if (S.armed[i] === "hotstreak") P(i).hot = true;
}
// Hint text: which side matches the picker's character taste.
function hintText() {
  const pc = P(S.picker).char;
  const t = TAGS[pc.taste];
  const a = S.card.A.g === pc.taste, b = S.card.B.g === pc.taste;
  if (a === b) return "💡 Hint: " + pc.name + " loves " + t.icon + " " + t.name + ", but no side is " + t.name + " this time.";
  return "💡 Hint: " + pc.name + " loves " + t.icon + " " + t.name + ". That is the side \"" + (a ? S.card.A.t : S.card.B.t) + "\".";
}
function nextCard() {
  if (!S.deck.length) S.deck = shuffle(CARDS);
  const [a, ta, b, tb] = S.deck.pop();
  return { A: { t: a, g: ta }, B: { t: b, g: tb } };
}
function guesser() { return other(S.picker); }
function label(i) {
  if (S.mode === 1) return i === 0 ? "You" : "Computer";
  return "Player " + (i + 1);
}

/* ---------- Shared pieces ---------- */
function header() {
  return el("div", { class: "top" },
    el("h1", {}, "Mind Reader Mania"),
    el("button", { class: "link", onclick: menu }, "Quit"));
}
function bar() {
  return el("div", { class: "bar" }, [0, 1].map(i => {
    const p = P(i);
    const role = S.picker === i ? "picking" : "guessing";
    const pw = POWERS[p.char.power];
    return el("div", { class: "chip" },
      pic(p.char),
      el("div", {},
        el("b", {}, p.char.name), el("span", { class: "role" }, role),
        el("div", { class: "small" }, label(i) + " · loves " + TAGS[p.char.taste].icon),
        POWERS_ON ? el("div", { class: "small" }, pw.icon + " " + pw.name + ": " +
          (S.frozen === i ? "frozen ❄️" : p.hot ? "on 🔥" : p.used ? "used" : "ready")) : null),
      el("div", { class: "score" }, p.score));
  }));
}
function roundLine() {
  const bonus = S.round > ROUNDS ? " (bonus round)" : "";
  return el("div", { class: "round" }, "Round " + S.round + " of " + S.total + bonus);
}
function sideNode(k, onclick, marks, picked) {
  const c = S.card[k];
  return el(onclick ? "button" : "div", { class: "side" + (picked ? " picked" : ""), onclick },
    c.t,
    marks ? el("span", { class: "marks" }, marks) : null,
    el("span", { class: "tag", title: TAGS[c.g].name }, TAGS[c.g].icon));
}
function sides(onPick, marks, pickedKey) {
  return el("div", { class: "sides" },
    sideNode("A", onPick ? () => onPick("A") : null, marks && marks.A, pickedKey === "A"),
    el("div", { class: "or" }, "OR"),
    sideNode("B", onPick ? () => onPick("B") : null, marks && marks.B, pickedKey === "B"));
}
function powerArea(i, phase, rerender) {
  if (S.armed[i]) {
    const k = S.armed[i];
    const pw = POWERS[k];
    if (k === "hint" || (k === "askone" && S.mode === 1)) return el("div", { class: "armed" }, hintText());
    if (k === "askone") return el("div", { class: "armed" },
      "❓ Ask " + P(S.picker).char.name + " one yes or no question out loud now! The answer must be true.");
    if (k === "hotstreak") return el("div", { class: "armed" }, "🔥 Hot Streak is ON for the rest of the game!");
    return el("div", { class: "armed" }, pw.icon + " " + pw.name + " is ON for this round!");
  }
  if (!canUse(i, phase)) return null;
  const k = powerKey(i);
  const pw = POWERS[k];
  const copied = P(i).char.power === "copy" ? " (copied with Copycat)" : "";
  return el("button", { class: "powerbtn", onclick: () => { usePower(i); rerender(); } },
    el("b", {}, pw.icon + " Use your power: " + pw.name + copied), el("br"),
    el("span", { class: "small" }, pw.text + " You can use it one time."));
}
function legend() {
  return el("div", { class: "legend" }, Object.values(TAGS).map(t => el("span", {}, t.icon + " " + t.name)));
}

function rulesBox() {

function choose(c) {
  S.chosen.push(c);
  if (S.mode === 2 && S.chosen.length < 2) { charScreen(); return; }
  if (S.mode === 1) {
    const comp = rnd(CHARS.filter(x => x !== c));
    S.chosen.push(comp);
    render(
      header(),
      el("div", { class: "cover" },
        pic(comp),
        el("h2", {}, "The computer picks " + comp.name + "!"),
        el("p", {}, comp.name + " loves " + TAGS[comp.taste].icon + " " + TAGS[comp.taste].name +
          ". That is a clue for your guesses!"),
        el("button", { class: "btn", onclick: startGame }, "Start the game")));
    return;
  }
  startGame();
}

/* ---------- Game ---------- */
function startGame() {
  const chosen = S.chosen;
  S = {
    mode: S.mode,
    players: chosen.map((c, i) => ({ char: c, score: 0, used: false, human: S.mode === 2 || i === 0 })),
    deck: shuffle(CARDS),
    round: 0, total: ROUNDS, picker: 1, repeat: false,
    memory: {}, frozen: null, frozenNext: null
  };
  nextRound();
}
function nextRound() {
  S.round++;
  if (!S.repeat) S.picker = other(S.picker);
  S.repeat = false;
  S.frozen = S.frozenNext;
  S.frozenNext = null;
  S.card = nextCard();
  S.pick = null; S.guess = null;
  S.armed = [null, null];
  S.why = { pick: "", guess: "" };
  const p = P(S.picker);
  if (!p.human) computerPick();
  else if (S.mode === 2) cover(S.picker, "pick");
  else pickScreen();
}
function cover(i, phase) {
  const p = P(i);
  const o = P(other(i));
  render(
    header(), bar(), roundLine(),
    el("div", { class: "cover" },
      pic(p.char),
      el("h2", {}, "Pass the device to " + p.char.name + " (" + label(i) + ")"),
      el("p", {}, o.char.name + ", look away! No peeking!"),
      el("button", { class: "btn", onclick: phase === "pick" ? pickScreen : guessScreen },
        "I am " + p.char.name + ". I am ready!")));
}
function pickScreen() {
  const i = S.picker;
  render(
    header(), bar(), roundLine(),
    el("p", { class: "info" }, el("b", {}, P(i).char.name + ", pick in secret. "),
      "Pick what you would REALLY choose. " + P(guesser()).char.name + " will try to guess it."),
    el("div", { class: "wyr" }, "Would you rather..."),
    sides(k => {
      S.pick = k;
      const g = guesser();
      if (!P(g).human) computerGuess();
      else if (S.mode === 2) cover(g, "guess");
      else guessScreen();
    }),
    powerArea(i, "pick", pickScreen),
    legend());
}
function guessScreen() {
  const i = guesser();
  const pk = P(S.picker);
  render(
    header(), bar(), roundLine(),
    el("p", { class: "info" }, el("b", {}, P(i).char.name + ", your turn to guess. "),
      "What did " + pk.char.name + " pick? (" + pk.char.name + " loves " + TAGS[pk.char.taste].icon + ")"),
    S.armed[S.picker] === "shield" ? el("div", { class: "armed" }, "🛡️ " + pk.char.name + " used Shield this round!") : null,
    el("div", { class: "wyr" }, "Would you rather..."),
    sides(k => { S.guess = k; reveal(); }),
    powerArea(i, "guess", guessScreen),
    legend());
}

/* ---------- Computer player ---------- */
function computerPick() {
  const i = S.picker;
  const me = P(i).char;
  if (canUse(i, "pick")) {
    const k = powerKey(i);
    const noTaste = S.card.A.g !== me.taste && S.card.B.g !== me.taste;
    if ((k === "newcard" && noTaste && Math.random() < 0.6) ||
        ((k === "shield" || k === "trick") && (Math.random() < 0.3 || S.round >= S.total - 1))) usePower(i);
  }
  const aT = S.card.A.g === me.taste, bT = S.card.B.g === me.taste;
  if (aT !== bT) {
    const tasteSide = aT ? "A" : "B";
    S.pick = Math.random() < 0.8 ? tasteSide : (tasteSide === "A" ? "B" : "A");
    S.why.pick = S.pick === tasteSide
      ? me.name + " picked it because " + me.name + " loves " + TAGS[me.taste].name + "!"
      : me.name + " surprised you! " + me.name + " did not pick the " + TAGS[me.taste].name + " side.";
  } else {
    S.pick = Math.random() < 0.5 ? "A" : "B";
    S.why.pick = me.name + " could not decide, so " + me.name + " just picked one.";
  }
  render(header(), bar(), roundLine(),
    S.armed[i] === "newcard" ? el("div", { class: "armed" }, "🔄 " + me.name + " used New Card!") : null,
    el("p", { class: "thinking" }, "💻 " + me.name + " is picking in secret..."));
  later(guessScreen, COMPUTER_DELAY);
}
function computerGuess() {
  const i = guesser();
  const me = P(i).char;
  if (canUse(i, "guess") && (Math.random() < 0.3 || S.round >= S.total - 1)) usePower(i);
  const a = S.memory[S.card.A.g] || 0;
  const b = S.memory[S.card.B.g] || 0;
  const pt = P(S.picker).char.taste;
  const aT = S.card.A.g === pt, bT = S.card.B.g === pt;
  if ((S.armed[i] === "hint" || S.armed[i] === "askone") && aT !== bT && Math.random() < 0.8) {
    S.guess = aT ? "A" : "B";
    S.why.guess = me.name + " used a hint about what " + P(S.picker).char.name + " loves.";
  } else if (a !== b && Math.random() < 0.85) {
    S.guess = a > b ? "A" : "B";
    S.why.guess = me.name + " guessed it because you seem to like " + TAGS[S.card[S.guess].g].name + ".";
  } else {
    S.guess = Math.random() < 0.5 ? "A" : "B";
    S.why.guess = me.name + " was not sure, so " + me.name + " guessed.";
  }
  render(header(), bar(), roundLine(),
    S.armed[i] ? el("div", { class: "armed" }, POWERS[S.armed[i]].icon + " " + me.name + " used " + POWERS[S.armed[i]].name + "!") : null,
    el("p", { class: "thinking" }, "💻 " + me.name + " is reading your mind..."));
  later(reveal, COMPUTER_DELAY);
}

/* ---------- Reveal and score ---------- */
function reveal() {
  const pi = S.picker, gi = guesser();
  const pk = P(pi), gs = P(gi);
  const right = S.guess === S.pick;
  const gp = S.armed[gi];
  const notes = [];
  let gain = right ? 1 : 0;
  let steal = 0;
  if (gp === "double" && right) { gain = 2; notes.push("✌️ Double! 2 points."); }
  if (gp === "bigbet") { gain = right ? 3 : -1; notes.push(right ? "🎲 Big Bet wins 3 points!" : "🎲 Big Bet lost 1 point."); }
  if (gp === "safety") { gain = 1; notes.push("🪂 Safety Net gives 1 point."); }
  if (gp === "steal" && right) { steal = 1; notes.push("🦝 Steal takes 1 point from " + pk.char.name + "."); }
  if (gp === "extra") { S.total++; S.repeat = true; notes.push("➕ Extra Turn! " + gs.char.name + " guesses again next round."); }
  if (gp === "lucky" && !right) {
    if (Math.random() < 0.5) { gain = 1; notes.push("🍀 Lucky Clover: the coin says HEADS! 1 point."); }
    else notes.push("🍀 Lucky Clover: the coin says TAILS. No point this time.");
  }
  if (gp === "freeze") { S.frozenNext = pi; notes.push("❄️ " + pk.char.name + " is frozen next round. No powers!"); }
  gs.streak = right ? (gs.streak || 0) + 1 : 0;
  if (gs.hot && right && gs.streak >= 2) {
    gain += 1; gs.streak = 0;
    notes.push("🔥 Hot Streak! 2 right guesses in a row gets 1 bonus point.");
  }
  if (S.armed[pi] === "trick" && !right) {
    pk.score += 1;
    notes.push("🃏 " + pk.char.name + " used Trick! The guess was wrong, so " + pk.char.name + " gets 1 point.");
  }
  if (S.armed[pi] === "shield" && gain > 0) {
    gain = 0; steal = 0;
    notes.push("🛡️ " + pk.char.name + "'s Shield blocked the points!");
  }
  gs.score = Math.max(0, gs.score + gain);
  pk.score = Math.max(0, pk.score - steal);

  // The computer learns what the human player likes.
  if (S.mode === 1 && pk.human) {
    const chosen = S.card[S.pick].g;
    const notChosen = S.card[S.pick === "A" ? "B" : "A"].g;
    if (chosen !== notChosen) {
      S.memory[chosen] = (S.memory[chosen] || 0) + 1;
      S.memory[notChosen] = (S.memory[notChosen] || 0) - 1;
    }
  }

  const marks = { A: "", B: "" };
  marks[S.pick] += "✅ " + pk.char.name + " picked this ";
  marks[S.guess] += "🔮 " + gs.char.name + " guessed this";
  const done = S.round >= S.total;
  render(
    header(), bar(), roundLine(),
    el("div", { class: "result" + (right ? "" : " miss") },
      el("h2", {}, right ? "🔮 " + gs.char.name + " read " + pk.char.name + "'s mind!" : "😮 Wrong guess!"),
      el("p", {}, gain > 0 ? gs.char.name + " gets " + gain + (gain === 1 ? " point." : " points.")
                           : gs.char.name + " gets no points this round."),
      notes.map(n => el("p", {}, n)),
      S.why.pick ? el("p", { class: "small" }, S.why.pick) : null,
      S.why.guess ? el("p", { class: "small" }, S.why.guess) : null),
    el("div", { class: "wyr" }, "Would you rather..."),
    sides(null, marks, S.pick),
    el("p", { class: "center", style: "margin-top:16px" },
      el("button", { class: "btn", onclick: done ? endGame : nextRound }, done ? "See who won" : "Next round ➜")));
}
function endGame() {
  const [a, b] = S.players;
  let title;
  if (a.score === b.score) title = "🤝 It is a tie! You both read minds!";
  else {
    const w = a.score > b.score ? 0 : 1;
    title = S.mode === 1
      ? (w === 0 ? "🏆 You win! You are a mind reader!" : "💻 " + P(1).char.name + " wins! Try again?")
      : "🏆 " + P(w).char.name + " (" + label(w) + ") wins!";
  }
  render(
    header(),
    el("div", { class: "result" },
      el("h2", {}, title),
      S.players.map((p, i) => el("div", { class: "row", style: "justify-content:center;margin:8px 0" },
        el("div", { style: "width:48px;height:48px" }, pic(p.char)),
        el("b", {}, p.char.name + " (" + label(i) + "): " + p.score + " points")))),
    el("p", { class: "center row", style: "justify-content:center" },
      el("button", { class: "btn", onclick: () => pickChars(S.mode) }, "Play again"),
      el("button", { class: "btn blue", onclick: menu }, "Main menu")));
}

menu();
</script>
